version: '3.8'

services:
  gpx-motion-studio:
    image: ghcr.io/thelittlerock/gpx-motion-studio:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpx-motion-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent SQLite database, vector cache & projects
      - ./data:/app/data
      # Exported videos (Apple ProRes 4444, WebM Transparent, MP4 H.264)
      - ./exports:/app/exports
      # User assets (GPX routes, background photos, maps)
      - ./assets:/app/assets
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
