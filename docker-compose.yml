version: '3.8'

services:
  gpx-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpx-motion-studio
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:8000"
    volumes:
      # Persistent SQLite project management database
      - ./data:/app/data
      # Exported ProRes 4444 movies and Fusion settings
      - ./exports:/app/exports
      # Optional local GPX route files
      - ./assets:/app/assets
      # Live application mounts
      - ./static:/app/static
      - ./server.py:/app/server.py
      - ./database.py:/app/database.py
      - ./vector_map_engine.py:/app/vector_map_engine.py
      - ./tile_service.py:/app/tile_service.py
      - ./gpx_parser.py:/app/gpx_parser.py
      - ./fusion_generator.py:/app/fusion_generator.py
      - ./map_stitcher.py:/app/map_stitcher.py
      - ./landmarks_data.py:/app/landmarks_data.py
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
